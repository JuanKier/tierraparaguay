<!DOCTYPE html>
<html lang='es'>
  <head>
    <meta charset='UTF-8' />
    <link rel='icon' href='/logo.jpeg' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
    <meta name='theme-color' content='#ea580c' />
    <title>Tierra Paraguay E.A.S</title>
    <style>
      #loading-screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#f8fafc; font-family:sans-serif; z-index:9999; }
      #loading-screen img { width:120px; height:120px; object-fit:contain; border-radius:16px; margin-bottom:24px; }
      #loading-screen p { color:#64748b; font-size:16px; margin:0; }
      .spinner { width:32px; height:32px; border:3px solid #e2e8f0; border-top-color:#ea580c; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:16px; }
      @keyframes spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id='root'>
      <div id="loading-screen">
        <img src="/logo.jpeg" alt="Tierra Paraguay" />
        <div class="spinner"></div>
        <p>Cargando...</p>
      </div>
    </div>
    <script type='module' src='/src/main.jsx'></script>
  </body>
</html>
